name: ci

on:
  push:
    branches: [main, "demo/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run tests and generate summary from xUnit CTRF results
        run: |
          dotnet run --project tests/Service.Tests/Service.Tests.csproj --no-launch-profile -- -result-ctrf "${{ runner.temp }}/tests.ctrf.json"
          bash scripts/test-summary.sh "${{ runner.temp }}/tests.ctrf.json" "${{ runner.temp }}/test-summary.json"
      - name: Validate CI report contract
        run: bash tests/ci-contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ runner.temp }}/test-summary.json

  image:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: bash scripts/image-meta.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  security:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (findings are reported to AegisOps; scanner errors fail CI)
        run: |
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks:v8.24.3 \
            git --report-format sarif --report-path /src/gitleaks.sarif --exit-code 0 .
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.177.0 semgrep scan \
            --config p/default --config p/csharp --metrics=off --sarif -o semgrep.sarif
      - name: Authenticate to GHCR for image scan
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.image.outputs.image }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Verify scanner output
        run: bash scripts/verify-scans.sh gitleaks.sarif semgrep.sarif trivy.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: scans
          path: |
            gitleaks.sarif
            semgrep.sarif
            trivy.sarif

  register:
    needs: [image, security]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-summary
      - uses: actions/download-artifact@v4
        with:
          name: scans
      - name: Check inputs and API reachability
        env:
          AEGISOPS_URL: ${{ vars.AEGISOPS_URL }}
          AEGISOPS_API_KEY: ${{ secrets.AEGISOPS_API_KEY }}
        run: |
          test -n "$AEGISOPS_URL" && test -n "$AEGISOPS_API_KEY" || { echo 'Set AEGISOPS_URL and AEGISOPS_API_KEY in this target repository' >&2; exit 1; }
          curl -fsS --connect-timeout 5 --max-time 15 "${AEGISOPS_URL%/}/health/ready" > /dev/null
      - uses: Trixxy98/AegisOps---DevSecOps-AI-Control-Plane/.github/actions/aegisops-report@dev
        with:
          url: ${{ vars.AEGISOPS_URL }}
          api-key: ${{ secrets.AEGISOPS_API_KEY }}
          project: site-service
          version: ${{ needs.image.outputs.version }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          image: ${{ needs.image.outputs.image }}
          digest: ${{ needs.image.outputs.digest }}
          test-summary: test-summary.json
          scans: gitleaks.sarif,semgrep.sarif,trivy.sarif
          deploy-to: Staging
